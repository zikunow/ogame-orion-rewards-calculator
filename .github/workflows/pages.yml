name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check calculator
        run: |
          node tests/prepare-sample.cjs
          node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - name: Collect static files
        run: |
          mkdir -p _site
          cp index.html styles.css rewards.css core.js rewards.js .nojekyll _site/
          cp -R ias_for-dummies shared _site/
          rm -f _site/shared/anomaly-sample.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Check published calculators
        run: node tests/browser-check.cjs

